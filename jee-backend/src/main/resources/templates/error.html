<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erreur de Traitement - LIAS')}"></head>
<body class="bg-light" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card border border-danger border-opacity-10 shadow-lg p-5 text-center bg-white" style="border-radius: 12px;">
                    <div class="mb-4">
                        <span class="d-inline-flex justify-content-center align-items-center rounded-circle bg-danger bg-opacity-10 text-danger" style="width: 64px; height: 64px;">
                            <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                        </span>
                    </div>

                    <h3 class="fw-bold text-dark mb-2" style="font-family: Georgia, serif;">Oups! Une erreur est survenue</h3>
                    <p class="text-secondary mb-4" th:text="${errorMessage}">Une erreur de traitement interne est survenue.</p>

                    <!-- Technical Details Accordion -->
                    <div class="accordion border-0 mb-4 bg-light rounded text-start" id="errorAccordion" th:if="${exceptionClass != null}">
                        <div class="accordion-item border-0 bg-transparent">
                            <h2 class="accordion-header" id="headingOne">
                                <button class="accordion-button collapsed bg-transparent text-secondary font-semibold text-xs py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne" style="font-size: 11px;">
                                    🔍 Informations Techniques pour l'Administrateur
                                </button>
                            </h2>
                            <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#errorAccordion">
                                <div class="accordion-body bg-white border rounded p-3 font-mono text-xs text-muted" style="max-height: 200px; overflow-y: auto; font-size: 11px; white-space: pre-wrap;">
<strong class="text-dark">Type d'exception :</strong> <span th:text="${exceptionClass}">Exception</span>
<strong class="text-dark">Description :</strong> <span th:text="${errorMessage}">Message</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 text-xs fw-semibold">
                            <i class="fa-solid fa-arrow-left me-1"></i> Page Précédente
                        </a>
                        <a th:href="@{/}" class="btn btn-primary px-4 py-2 text-xs fw-semibold" style="background-color: var(--univ-brand); border-color: var(--univ-brand);">
                            <i class="fa-solid fa-house me-1"></i> Accueil du Portail
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
