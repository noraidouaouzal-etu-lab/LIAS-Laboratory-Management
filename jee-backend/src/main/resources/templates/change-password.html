<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Changement de Mot de Passe Obligatoire - LIAS')}"></head>
<body class="d-flex align-items-center justify-content-center bg-light" style="min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Logo & Academic Identity Header -->
                <div class="text-center mb-4">
                    <img th:src="@{/images/logo.png}" alt="Laboratoire LIAS Logo" class="lias-logo mx-auto mb-2">
                    <div class="mt-3">
                        <span class="badge bg-opacity-10 text-uppercase fw-bold px-3 py-1.5" style="background-color: rgba(15, 23, 42, 0.08); color: var(--univ-blue); letter-spacing: 1px; font-size: 11px;">
                            Sécurité du Compte
                        </span>
                    </div>
                </div>

                <!-- Main Password Change Card -->
                <div class="card border border-light p-4 shadow-lg bg-white" style="border-radius: 12px !important; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08) !important;">
                    
                    <div class="text-center mb-4">
                        <h4 class="fw-bold m-0 text-danger" style="font-family: 'Georgia', serif; font-size: 1.25rem;">Nouveau Mot de Passe</h4>
                        <p class="text-xs text-muted m-0 mt-1" style="font-size: 11px; letter-spacing: 0.5px;">Veuillez changer votre mot de passe temporaire</p>
                        <div class="mt-2 mx-auto" style="width: 50px; height: 3px; background: var(--univ-gold); border-radius: 2px;"></div>
                    </div>

                    <form th:action="@{/change-password}" method="post">
                        <!-- Alert Error -->
                        <div th:if="${error}" class="alert alert-danger py-2 text-center border-0 font-mono" style="font-size: 11.5px; border-radius: 6px;">
                            <i class="fa-solid fa-circle-exclamation me-1.5"></i> <span th:text="${error}">Erreur</span>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label text-xs fw-bold text-secondary text-uppercase" style="font-size: 10px; letter-spacing: 0.5px;">Nouveau Mot de Passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted" style="border-right: none;"><i class="fa-solid fa-lock" style="font-size: 12px;"></i></span>
                                <input type="password" class="form-control border-start-0 text-sm" id="newPassword" name="newPassword" placeholder="••••••••" required style="font-size: 13px; font-weight: 500;">
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label text-xs fw-bold text-secondary text-uppercase" style="font-size: 10px; letter-spacing: 0.5px;">Confirmer le Mot de Passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted" style="border-right: none;"><i class="fa-solid fa-circle-check" style="font-size: 12px;"></i></span>
                                <input type="password" class="form-control border-start-0 text-sm" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required style="font-size: 13px; font-weight: 500;">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-2" 
                                style="font-size: 12px; letter-spacing: 1px;">
                            <span>Changer le mot de passe</span> <i class="fa-solid fa-key" style="font-size: 12px;"></i>
                        </button>
                    </form>
                </div>

                <!-- Footer back link/logout -->
                <div class="text-center mt-4">
                    <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color: var(--univ-blue); font-size: 12px;">
                        <i class="fa-solid fa-arrow-left me-1"></i> Retour à la Connexion
                    </a>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
